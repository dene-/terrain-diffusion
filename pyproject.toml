[project]
name = "terrain-diffusion"
version = "0.1.0"
description = "Infinite, deterministic terrain generation with diffusion models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=0.34.2",
    "cartopy>=0.23.0",
    "catalogue>=2.0.10",
    "certifi>=2024.8.30",
    "click>=8.1.6",
    "confection>=0.1.5",
    "diffusers>=0.30.3",
    "earthengine-api>=1.1.2",
    "easydict>=1.13",
    "ema-pytorch>=0.7.7",
    "fastapi>=0.115.0",
    "flask>=3.0.3",
    "global-land-mask>=1.0.0",
    "h5py>=3.12.1",
    "infinite-tensor>=0.3.0",
    "lpips>=0.1.4",
    "matplotlib>=3.9.2",
    "networkx>=3.2.1",
    "numba>=0.59.0",
    "numpy>=2.1.3",
    "optuna>=4.1.0",
    "pillow>=11.0.0",
    "pyfastnoiselite==0.0.6",
    "pyyaml>=6.0.1",
    "rasterio>=1.4.0",
    "safetensors>=0.4.5",
    "schedulefree>=1.3",
    "scikit-image>=0.24.0",
    "scipy>=1.14.1",
    "tifffile>=2024.9.20",
    "torch>=2.4.1",
    "torch-fidelity>=0.3.0",
    "torchmetrics>=1.4.2",
    "torchvision>=0.19.1",
    "tqdm>=4.66.5",
    "uvicorn>=0.32.0",
    "wandb>=0.18.2",
]

[project.optional-dependencies]
panorama = ["transformers>=4.44.0"]

[tool.uv]
package = false
